name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-and-tests:
    name: API, Web, libraries + tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build LekhaBook.Server.slnf -c Release
      - name: Test
        run: dotnet test LekhaBook.Server.slnf -c Release --no-build

  mobile-app:
    name: MAUI app (Android + Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Build Android
        run: dotnet build src/LekhaBook.App -c Release -f net10.0-android
      - name: Build Windows
        run: dotnet build src/LekhaBook.App -c Release -f net10.0-windows10.0.19041.0
