name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-and-tests:
    name: API, Web, libraries + tests (Linux)
    runs-on: ubuntu-latest
    services:
      # Throwaway PostgreSQL for the migration tests (each test creates and drops its own database).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lekhabook
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lekhabook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build LekhaBook.Server.slnf -c Release
      - name: Test
        run: dotnet test LekhaBook.Server.slnf -c Release --no-build --logger trx --results-directory test-results
        env:
          LEKHABOOK_TEST_PG: Host=localhost;Port=5432;Database=postgres;Username=lekhabook;Password=ci_only_password
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  mobile-app:
    name: MAUI app (Android + Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Build Android
        run: dotnet build src/LekhaBook.App -c Release -f net10.0-android
      - name: Build Windows
        run: dotnet build src/LekhaBook.App -c Release -f net10.0-windows10.0.19041.0
