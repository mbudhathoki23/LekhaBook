name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lekhabook
          POSTGRES_PASSWORD: lekhabook
          POSTGRES_DB: lekhabook
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U lekhabook"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Run tests
        env:
          LEKHABOOK_TEST_PG: Host=localhost;Port=5432;Database=lekhabook;Username=lekhabook;Password=lekhabook
        run: dotnet test --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
